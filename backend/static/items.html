<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Browse items - Campus Lost &amp; Found</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>
<noscript><div class="container"><div class="alert alert-error" style="margin-top:20px">This portal needs JavaScript. Please enable it in your browser.</div></div></noscript>
<main>
<div class="container">
  <div class="page-head"><h1>Lost &amp; found items</h1><p>Search by keyword, category, place or date. No account needed to browse.</p></div>
  <form class="card" id="filters" style="margin-bottom:22px">
    <div class="filters">
      <div class="field wide"><label for="q">Search</label><input id="q" class="input" type="search" placeholder="e.g. black wallet, calculator" maxlength="200"></div>
      <div class="field"><span class="label">Type</span><div class="seg" id="type-seg"><button type="button" data-type="" aria-pressed="true">All</button><button type="button" data-type="LOST" aria-pressed="false">Lost</button><button type="button" data-type="FOUND" aria-pressed="false">Found</button></div></div>
      <div class="field"><label for="status">Status</label><select id="status" class="input"><option value="">Any status</option><option value="ACTIVE">Open</option><option value="CLAIM_PENDING">Claim under review</option><option value="CLAIMED">Claim approved</option><option value="RETURNED">Returned</option><option value="CLOSED">Closed</option></select></div>
      <div class="field"><label for="category">Category</label><select id="category" class="input"><option value="">All categories</option></select></div>
      <div class="field"><label for="location">Location</label><select id="location" class="input"><option value="">All locations</option></select></div>
      <div class="field"><label for="date_from">From date</label><input id="date_from" class="input" type="date"></div>
      <div class="field"><label for="date_to">To date</label><input id="date_to" class="input" type="date"></div>
    </div>
    <div class="row between" style="margin-top:14px"><span class="muted small" id="summary" aria-live="polite"></span><button class="btn btn-ghost btn-sm" id="clear" type="button">Clear filters</button></div>
    <div id="filter-error" style="margin-top:10px"></div>
  </form>
  <div id="grid" class="items-grid"></div>
  <div class="pager" id="pager"></div>
</div>
</main>
<div id="site-footer"></div>
<script type="module" src="js/pages/items.js"></script>
</body>
</html>
