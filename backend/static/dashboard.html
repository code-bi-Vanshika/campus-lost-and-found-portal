<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dashboard - Campus Lost &amp; Found</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>
<noscript><div class="container"><div class="alert alert-error" style="margin-top:20px">This portal needs JavaScript. Please enable it in your browser.</div></div></noscript>
<main>
<div class="container">
  <div class="page-head row between"><div><h1 id="hello">Hello</h1><p>Your claims, reviews and reports in one place.</p></div>
    <div class="row"><a class="btn btn-amber" href="report.html?type=LOST">Report lost item</a><a class="btn btn-secondary" href="report.html?type=FOUND">Report found item</a></div></div>
  <div class="stats" id="stats" style="margin-bottom:24px">
    <div class="skel" style="min-height:88px"></div><div class="skel" style="min-height:88px"></div><div class="skel" style="min-height:88px"></div><div class="skel" style="min-height:88px"></div></div>
  <div class="detail" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">
    <div class="card"><div class="card-head"><h3>Claims waiting for your review</h3><a class="small" href="review.html">All reviews</a></div><div id="review-box" class="stack"><div class="skel"></div></div></div>
    <div class="card"><div class="card-head"><h3>My claims</h3><a class="small" href="claims.html">View all</a></div><div id="claims-box"><div class="skel"></div></div></div>
    <div class="card"><div class="card-head"><h3>Recent notifications</h3><a class="small" href="notifications.html">View all</a></div><div id="notif-box"><div class="skel"></div></div></div>
    <div class="card"><div class="card-head"><h3>My reports</h3><a class="small" href="reports.html">View all</a></div><div id="reports-box"><div class="skel"></div></div></div>
  </div>
</div>
</main>
<div id="site-footer"></div>
<script type="module" src="js/pages/dashboard.js"></script>
</body>
</html>
