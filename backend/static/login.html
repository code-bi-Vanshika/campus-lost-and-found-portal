<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Log in - Campus Lost &amp; Found</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div id="site-header"></div>
<noscript><div class="container"><div class="alert alert-error" style="margin-top:20px">This portal needs JavaScript. Please enable it in your browser.</div></div></noscript>
<main>
<div class="container narrow section">
  <h1>Log in</h1><p class="muted">Use your portal account to report items and submit claims.</p>
  <div id="notice"></div>
  <form class="card" id="login-form" novalidate style="margin-top:14px">
    <div id="form-error"></div>
    <div class="field"><label for="email">Email</label><input id="email" class="input" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" class="input" type="password" autocomplete="current-password" required></div>
    <button class="btn btn-primary btn-block" type="submit" id="submit">Log in</button>
  </form>
  <p class="center muted" style="margin-top:16px">New here? <a href="register.html">Create an account</a></p>
</div>
</main>
<div id="site-footer"></div>
<script type="module" src="js/pages/login.js"></script>
</body>
</html>
